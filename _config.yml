# Site settings
title: Suhas
email: hi@bnsuhas.com
description: ""
baseurl: ""
url: "https://bnsuhas.com"

# Author information
author: Suhas

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Header navigation pages
header_pages:
  - _pages/stories.md
  - _pages/photography.md

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _attachments
  - _nav_menu_items
  - _s-custom-csss
  - bnsuhas.com

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Theme
theme: minima

# Navigation
navigation:
  - title: Research
    url: /#research
  - title: Talks
    url: /#talks
  - title: Stories
    url: /stories/
  - title: Photography
    url: /photography/
